version: '3.8'

services:
  # Go backend with hot-reload
  api:
    image: golang:1.22-alpine
    container_name: relaystation-dev-api
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ..:/app
      - go-cache:/go/pkg/mod
    environment:
      - RELAYSTATION_CONFIG=/app/configs/streams.json
      - RELAYSTATION_OUTPUT=/app/hls-output
      - RELAYSTATION_STATIC=/app/web/build
      - RELAYSTATION_ADDR=:8080
    command: |
      sh -c "
        apk add --no-cache ffmpeg git &&
        go install github.com/cosmtrek/air@latest &&
        air -c .air.toml
      "

  # SvelteKit frontend with hot-reload
  web:
    image: node:20-alpine
    container_name: relaystation-dev-web
    working_dir: /app/web
    ports:
      - "5173:5173"
    volumes:
      - ../web:/app/web
      - node-modules:/app/web/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  go-cache:
  node-modules:
